{% extends 'base.html' %}

{% block title %}Excluir colaborador | Controle Oficina{% endblock %}

{% block content %}
  <div class='mx-auto max-w-xl rounded-xl border border-red-200 bg-white p-6 text-slate-900'>
    <h1 class='text-2xl font-semibold text-red-700'>Excluir colaborador</h1>
    <p class='mt-4 text-sm text-slate-600'>Tem certeza que deseja excluir <span class='font-semibold text-slate-900'>{{ object.name }}</span>?</p>

    <form method='post' class='mt-6 flex flex-wrap gap-3'>
      {% csrf_token %}
      <button type='submit' class='rounded-md bg-red-600 px-4 py-2 font-semibold text-white hover:bg-red-700'>
        Excluir
      </button>
      <a href='{% url "users:collaborator_list" %}' class='rounded-md border border-slate-400 bg-slate-50 px-4 py-2 font-medium text-slate-800 hover:bg-slate-100'>
        Cancelar
      </a>
    </form>
  </div>
{% endblock %}
