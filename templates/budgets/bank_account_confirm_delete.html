{% extends 'base.html' %}

{% block title %}Excluir conta bancária | Controle Oficina{% endblock %}

{% block content %}
  <div class='mx-auto max-w-xl rounded-xl border border-slate-200 bg-white p-6'>
    <h1 class='text-2xl font-semibold text-amber-700'>Excluir conta bancária</h1>
    <p class='mt-4 text-sm text-slate-500'>Tem certeza que deseja excluir <span class='text-slate-900'>{{ object.bank_name }} - {{ object.account_name }}</span>?</p>

    <form method='post' class='mt-6 flex flex-wrap gap-3'>
      {% csrf_token %}
      <button type='submit' class='rounded-md bg-gradient-to-r from-[#D4AF37] to-[#AA882C] px-4 py-2 font-semibold text-[#0D0D0D]'>Excluir</button>
      <a href='{% url "budgets:bank_account_list" %}' class='rounded-md border border-slate-300 bg-white px-4 py-2 hover:border-[#D4AF37]'>Cancelar</a>
    </form>
  </div>
{% endblock %}
